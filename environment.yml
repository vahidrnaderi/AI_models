# Binder build environment (Python 3.10, CPU-only PyTorch).
# For local Python 3.14 use environment.local.yml.
name: AI_models
channels:
  - pytorch
  - fastai
  - conda-forge
dependencies:
  - python=3.10
  - cpuonly
  - pytorch
  - torchvision
  - fastai
  - ipywidgets
  - pip
  - pip:
    - -r requirements-binder.txt
